<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Education Hub</title>
  <link rel="stylesheet" href="./dist/output.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="font-display bg-white text-gray-800">

  <!-- ===================== NAVBAR ===================== -->
  <header class="sticky top-0 z-50 bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Logo -->
        <a href="#" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-white"></i>
          </div>
          <div>
            <span class="text-xl font-bold text-amber-500">EDUCATION</span>
            <span class="text-xl font-bold text-gray-800"> HUB</span>
          </div>
        </a>

        <!-- Menu -->
        <nav class="flex items-center gap-1">
          <a href="#about" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-amber-500 transition">Home</a>
          <a href="#about" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-amber-500 transition">About us</a>
          <a href="#subjects" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-amber-500 transition">Subject</a>
          <a href="#gallery" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-amber-500 transition">Gallery</a>
          <a href="#contact" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-amber-500 transition">Contact</a>
        </nav>

      </div>
    </div>
  </header>

  <!-- ===================== HERO SECTION ===================== -->
  <section id="home" class="relative overflow-hidden bg-white">
    <div class="max-w-7xl mx-auto px-8 py-20">
      <div class="grid grid-cols-2 gap-12 items-center">
        
        <!-- Left Content -->
        <div>
          <h1 class="text-7xl font-extrabold leading-none mb-4">
            <span class="text-amber-500">EDUCATION</span><br />
            <span class="text-gray-900">HUB</span>
          </h1>
          
          <p class="text-lg text-gray-600 mb-2">
            <span class="text-amber-500 font-semibold">Education Hub</span> is Part of Your Heart about Learning.
          </p>
          <p class="text-gray-600 mb-8 max-w-md">
            We can take you to the best future, join with us!<br />
            Let’s be the best in ourselves!
          </p>

          <div class="flex gap-4">
            <a href="#contact" class="bg-amber-400 hover:bg-amber-500 text-white font-semibold px-8 py-3 rounded-lg transition">
              Join
            </a>
            <a href="#contact" class="border-2 border-amber-400 text-amber-500 hover:bg-amber-50 font-semibold px-8 py-3 rounded-lg transition">
              Contact us
            </a>
          </div>
        </div>

        <!-- Right Image -->
        <div class="relative">
          <!-- Decorative circles -->
          <div class="absolute -top-6 -right-6 w-32 h-32 border-4 border-amber-300 rounded-full opacity-60"></div>
          <div class="absolute top-20 -left-4 w-20 h-20 border-4 border-amber-300 rounded-full opacity-50"></div>
          <div class="absolute bottom-10 right-10 w-16 h-16 border-4 border-amber-300 rounded-full opacity-40"></div>

          <img 
            src="assets/images/stu learning.jpg" 
            alt="Students learning" 
            class="relative z-10 w-full max-w-lg rounded-2xl object-cover shadow-xl"
          />
        </div>

      </div>
    </div>
  </section>

</body>
</html>
